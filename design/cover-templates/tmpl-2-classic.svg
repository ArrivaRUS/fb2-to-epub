<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Книжная обложка, классика">
  <title>Шаблон 2 — Классика</title>
  <desc>Кремовый фон, двойная благородная рамка с угловыми ромбами, центрированная антиква, издательский вид.</desc>

  <!-- ===================== ФОН ===================== -->
  <rect x="0" y="0" width="1200" height="1800" fill="#F6EFE0"/>
  <!-- Едва заметная виньетка-подложка для глубины -->
  <rect x="0" y="0" width="1200" height="1800" fill="#000000" opacity="0.015"/>

  <!-- ===================== ДВОЙНАЯ РАМКА ===================== -->
  <!-- Внешняя толстая + внутренняя тонкая — классический «издательский» приём. -->
  <rect x="80" y="80" width="1040" height="1640" fill="none" stroke="#3A2E1E" stroke-width="6"/>
  <rect x="104" y="104" width="992" height="1592" fill="none" stroke="#3A2E1E" stroke-width="2"/>

  <!-- Угловые ромбы-акценты на внутренней рамке -->
  <g fill="#8A6D3B">
    <rect x="94" y="94" width="20" height="20" transform="rotate(45 104 104)"/>
    <rect x="1086" y="94" width="20" height="20" transform="rotate(45 1096 104)"/>
    <rect x="94" y="1686" width="20" height="20" transform="rotate(45 104 1696)"/>
    <rect x="1086" y="1686" width="20" height="20" transform="rotate(45 1096 1696)"/>
  </g>

  <!-- ===================== ВЕРХНИЙ ОРНАМЕНТ ===================== -->
  <!-- Маленький наборный флёрон над автором (центрирован). -->
  <g stroke="#8A6D3B" stroke-width="2.5" fill="none">
    <path d="M520 360 q40 -30 80 0 q40 30 80 0"/>
    <circle cx="600" cy="360" r="5" fill="#8A6D3B" stroke="none"/>
  </g>

  <!-- ===================== ЗОНА АВТОРА {author} ===================== -->
  <!-- {author}: вверху, над названием — классический порядок «издательства».
       Антиква с разрядкой. Правило тяги: одна строка; длинное имя —
       уменьшить кегль (69→52) и разрядку (6→3) либо 2 строки. -->
  <text x="600" y="478" text-anchor="middle"
        font-family="'Baskerville', Georgia, 'Times New Roman', serif"
        font-size="69" letter-spacing="6" fill="#3A2E1E">АЛЕКСЕЙ ВАРЛАМОВ</text>

  <!-- Разделительная линия автор / название -->
  <line x1="450" y1="560" x2="750" y2="560" stroke="#8A6D3B" stroke-width="1.5"/>

  <!-- ===================== ЗОНА НАЗВАНИЯ {title} ===================== -->
  <!-- {title}: оптический центр обложки, крупная антиква с курсивным духом.
       ШРИФТ: Georgia italic (НЕ Baskerville italic — он рендерит «ы» как «ъı»
       в cairosvg, см. .patches/012). Georgia italic даёт чистую кириллицу.
       Правило тяги: 1 строка для короткого; длинное название скрипт
       разбивает на 2–3 центрированные строки (шаг 1.1em) с уменьшением
       кегля (177 → 120 → 92). Блок вертикально центрируется около y≈840.
       ВАЖНО (узкая рамка классики): базовый кегль 177 держит лишь ~9-10
       узких букв в строке («Падчевары» ок). Проверено: «Воскресение» влезает
       только при ≤150, «Преступление» при ≤130. Скрипт должен мерить ширину
       строки и уменьшать кегль/переносить РАНЬШЕ, чем в других шаблонах. -->
  <text x="600" y="868" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="177" font-style="italic" fill="#1E150A">Падчевары</text>

  <!-- Разделительная линия под названием -->
  <line x1="500" y1="980" x2="700" y2="980" stroke="#8A6D3B" stroke-width="1.5"/>

  <!-- ===================== НИЖНИЙ ОРНАМЕНТ ===================== -->
  <!-- Зеркальный флёрон у нижнего поля. -->
  <g stroke="#8A6D3B" stroke-width="2.5" fill="none">
    <path d="M520 1480 q40 30 80 0 q40 -30 80 0"/>
    <circle cx="600" cy="1480" r="5" fill="#8A6D3B" stroke="none"/>
  </g>

  <!-- Низ: декоративная «издательская» подпись (опционально). -->
  <text x="600" y="1600" text-anchor="middle"
        font-family="'Baskerville', Georgia, serif"
        font-size="39" letter-spacing="10" fill="#8A6D3B">КЛАССИКА</text>
</svg>
