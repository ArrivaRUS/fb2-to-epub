<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Книжная обложка, тёмный премиум">
  <title>Шаблон 4 — Тёмный премиум</title>
  <desc>Тёмный фон в стиле приложения, тёплый оранжевый акцент, тонкая золотая рамка, изящная антиква по центру.</desc>

  <!-- ШРИФТЫ: проверено под cairosvg на macOS — Cochin и Gill Sans корректно
       рендерят кириллицу. Didot/Futura НЕЛЬЗЯ (tofu), см. .patches/012.
       Cochin держит высокий контраст штриха («дидоновский» дорогой дух). -->

  <defs>
    <!-- Мягкое радиальное свечение за названием — премиальная глубина -->
    <radialGradient id="glow4" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#1C1A24"/>
      <stop offset="100%" stop-color="#0E0E14"/>
    </radialGradient>
  </defs>

  <!-- ===================== ФОН ===================== -->
  <rect x="0" y="0" width="1200" height="1800" fill="#0E0E14"/>
  <rect x="0" y="0" width="1200" height="1800" fill="url(#glow4)"/>

  <!-- ===================== РАМКА ===================== -->
  <!-- Тонкая тёплая рамка-поле, цвет акцента приглушён. -->
  <rect x="80" y="80" width="1040" height="1640" fill="none" stroke="#F59E42" stroke-width="1.5" opacity="0.55"/>

  <!-- ===================== ВЕРХНЯЯ МЕТКА ===================== -->
  <text x="600" y="336" text-anchor="middle"
        font-family="'Gill Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="43" letter-spacing="16" fill="#F59E42" opacity="0.85">РОМАН</text>

  <!-- ===================== АКЦЕНТНАЯ ФОРМА ===================== -->
  <!-- Тонкая оранжевая линия с ромбом — «дорогой» разделитель над названием. -->
  <g stroke="#F59E42" stroke-width="1.5">
    <line x1="430" y1="470" x2="560" y2="470"/>
    <line x1="640" y1="470" x2="770" y2="470"/>
  </g>
  <rect x="592" y="462" width="16" height="16" transform="rotate(45 600 470)" fill="#F59E42"/>

  <!-- ===================== ЗОНА НАЗВАНИЯ {title} ===================== -->
  <!-- {title}: по центру, светлая антиква, крупно, на тёмном.
       Правило тяги: 1 строка для короткого; длинное название скрипт
       переносит на 2–3 центрированные строки (шаг 1.12em) с уменьшением
       кегля (177 → 120 → 92). Блок центрируется по вертикали около y≈820. -->
  <text x="600" y="848" text-anchor="middle"
        font-family="Cochin, 'Hoefler Text', Georgia, 'Times New Roman', serif"
        font-size="177" fill="#F5F0E6">Падчевары</text>

  <!-- Тонкая подчёркивающая линия акцента -->
  <line x1="510" y1="950" x2="690" y2="950" stroke="#F59E42" stroke-width="2"/>

  <!-- ===================== ЗОНА АВТОРА {author} ===================== -->
  <!-- {author}: ниже, тёплый светлый гротеск с разрядкой, приглушённый.
       Правило тяги: 1 строка; длинное имя — кегль 63→48 и разрядка 10→5,
       либо 2 строки. -->
  <text x="600" y="1065" text-anchor="middle"
        font-family="'Gill Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="63" letter-spacing="10" fill="#C9C2B4">АЛЕКСЕЙ ВАРЛАМОВ</text>

  <!-- ===================== НИЖНИЙ ДЕКОР ===================== -->
  <!-- Малый ромб у нижнего поля — рифма к верхнему акценту. -->
  <rect x="594" y="1554" width="12" height="12" transform="rotate(45 600 1560)" fill="#F59E42" opacity="0.85"/>
</svg>
