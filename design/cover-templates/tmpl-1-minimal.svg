<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Книжная обложка, минимализм">
  <title>Шаблон 1 — Минимализм</title>
  <desc>Светлый бумажный фон, много воздуха, тонкая элегантная антиква по центру, одна акцентная линия.</desc>

  <!-- ШРИФТЫ: проверено под cairosvg на macOS — Hoefler Text и Gill Sans
       корректно рендерят кириллицу. Didot/Futura НЕЛЬЗЯ (дают tofu), см.
       .patches/012. Всегда оставляем серверный fallback-стек. -->

  <!-- ===================== ФОН ===================== -->
  <!-- Тёплый бумажный фон. Скрипт может заменить на другой светлый оттенок. -->
  <rect x="0" y="0" width="1200" height="1800" fill="#F4F1EA"/>

  <!-- Тонкая рамка-поле: задаёт «воздух», отступ 90px от краёв -->
  <rect x="90" y="90" width="1020" height="1620" fill="none" stroke="#D8D2C4" stroke-width="2"/>

  <!-- ===================== ВЕРХНЯЯ МЕТКА ===================== -->
  <!-- Маленькая надстрочная метка (опционально: жанр/серия). -->
  <text x="600" y="360" text-anchor="middle"
        font-family="'Gill Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="45" letter-spacing="14" fill="#A89F8C">РОМАН</text>

  <!-- ===================== ЗОНА НАЗВАНИЯ {title} ===================== -->
  <!-- {title}: по центру, тонкая антиква, крупно. Базовая линия ~ y=860.
       Правило тяги: одна строка при коротком названии. Если длинное —
       скрипт переносит на 2–3 строки с шагом 1.15em и центрирует блок
       по вертикали относительно y≈830; при этом кегль уменьшается
       (166 → 116 → 86) чтобы строка влезала в ширину поля ~960px. -->
  <text x="600" y="860" text-anchor="middle"
        font-family="'Hoefler Text', Georgia, 'Times New Roman', serif"
        font-size="166" fill="#1A1A1A">Падчевары</text>

  <!-- ===================== АКЦЕНТНАЯ ЛИНИЯ ===================== -->
  <!-- Единственный графический акцент: тонкая короткая линия под названием. -->
  <line x1="540" y1="960" x2="660" y2="960" stroke="#B0492E" stroke-width="3"/>

  <!-- ===================== ЗОНА АВТОРА {author} ===================== -->
  <!-- {author}: ниже линии, гротеск, разрядка, спокойный серый.
       Правило тяги: одна строка; при очень длинном имени
       («Фёдор Михайлович Достоевский») скрипт уменьшает letter-spacing
       (8→4) и кегль (60→46), либо переносит на 2 строки. -->
  <text x="600" y="1060" text-anchor="middle"
        font-family="'Gill Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="60" letter-spacing="8" fill="#5A5448">АЛЕКСЕЙ ВАРЛАМОВ</text>

  <!-- ===================== НИЖНИЙ ДЕКОР ===================== -->
  <!-- Малая точка-кода у нижнего поля для завершённости композиции. -->
  <circle cx="600" cy="1560" r="5" fill="#B0492E"/>
</svg>
