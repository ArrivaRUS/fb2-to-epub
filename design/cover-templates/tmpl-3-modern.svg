<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Книжная обложка, смелый модерн">
  <title>Шаблон 3 — Смелый модерн</title>
  <desc>Контрастная диагональ делит обложку, крупный гротеск, экспрессивный цвет-блок, имя автора в цветной плашке.</desc>

  <defs>
    <clipPath id="frame3">
      <rect x="0" y="0" width="1200" height="1800"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame3)">
    <!-- ===================== ФОН ===================== -->
    <rect x="0" y="0" width="1200" height="1800" fill="#FAFAF7"/>

    <!-- ===================== ДИАГОНАЛЬНЫЙ ЦВЕТ-БЛОК ===================== -->
    <!-- Крупная контрастная диагональ — главный модерновый жест.
         Скрипт может менять акцентный цвет на любой яркий. -->
    <polygon points="0,1800 0,720 1200,300 1200,1800" fill="#E63946"/>
    <!-- Узкая «тень»-полоса по краю диагонали для динамики -->
    <polygon points="0,720 1200,300 1200,360 0,780" fill="#1D1D1D"/>

    <!-- ===================== ЗОНА НАЗВАНИЯ {title} ===================== -->
    <!-- {title}: очень крупный жирный гротеск, ВЕРХНИЙ РЕГИСТР, прижат к левому
         полю (x=110), на светлой верхней части.
         Правило тяги: строки складываются стопкой сверху вниз с шагом ~0.95em.
         Короткое название «Лох» — одна крупная строка (кегль до 230).
         Длинное «Война и мир. Том первый» — скрипт разбивает по словам на
         несколько строк и уменьшает кегль (170 → 120 → 92), сохраняя левое
         выравнивание; нижняя строка не должна заходить за диагональ (y<640). -->
    <text x="110" y="300"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="200" letter-spacing="-6" fill="#1D1D1D">ПАД-</text>
    <text x="110" y="500"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="200" letter-spacing="-6" fill="#1D1D1D">ЧЕВА-</text>
    <text x="110" y="660"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="160" letter-spacing="-6" fill="#E63946">РЫ</text>

    <!-- ===================== ЗОНА АВТОРА {author} ===================== -->
    <!-- {author}: на цветном поле, белая плашка с тёмным текстом — контраст.
         Прижат к левому полю, нижняя треть. Гротеск, разрядка.
         Правило тяги: ширина плашки = ширина текста + поля (скрипт считает).
         Длинное имя — уменьшить кегль (54→42) или 2 строки в плашке. -->
    <rect x="110" y="1380" width="640" height="120" fill="#FAFAF7"/>
    <text x="150" y="1462"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="56" letter-spacing="2" fill="#1D1D1D">АЛЕКСЕЙ ВАРЛАМОВ</text>

    <!-- Маленькая надстрочная подпись на плашке-метке -->
    <rect x="110" y="1320" width="200" height="48" fill="#1D1D1D"/>
    <text x="130" y="1354"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="26" letter-spacing="6" fill="#FAFAF7">РОМАН</text>
  </g>
</svg>
