<svg width="760" height="200" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fb2 to epub wordmark — sunset">
  <defs>
    <radialGradient id="w3-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#171120"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </radialGradient>
    <linearGradient id="w3-sunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFC24D"/>
      <stop offset="45%" stop-color="#FF7A3C"/>
      <stop offset="100%" stop-color="#F0408A"/>
    </linearGradient>
    <linearGradient id="w3-epub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0408A"/>
      <stop offset="100%" stop-color="#9B47E6"/>
    </linearGradient>
    <filter id="w3-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="200" rx="28" fill="url(#w3-bg)"/>

  <style>
    .wm3 { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; }
  </style>

  <text x="56" y="120" class="wm3" font-size="76" fill="#F2EDF6" letter-spacing="-2">fb2</text>

  <!-- chevron page mark matching the icon -->
  <g filter="url(#w3-glow)">
    <path d="M236 68 L236 116 L276 92 Z" fill="url(#w3-sunset)" opacity="0.5"/>
    <path d="M272 68 L272 116 L316 92 Z" fill="url(#w3-sunset)"/>
  </g>

  <text x="342" y="120" class="wm3" font-size="76" fill="url(#w3-epub)" letter-spacing="-2">epub</text>

  <text x="58" y="162" class="wm3" font-size="17" fill="#8A7AA0" letter-spacing="7" font-weight="600">BOOKS &#8594; READY ON MAC</text>
</svg>
